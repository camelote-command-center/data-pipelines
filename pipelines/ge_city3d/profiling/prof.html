<!doctype html><html><head><meta charset="utf-8"><title>3D profiling</title>
<script>window.CESIUM_BASE_URL='https://cdnjs.cloudflare.com/ajax/libs/cesium/1.133.1/';</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.133.1/Cesium.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.133.1/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#v{margin:0;width:100%;height:100%;overflow:hidden}#o{position:absolute;top:6px;left:6px;background:#000c;color:#0f0;font:11px monospace;padding:6px;white-space:pre}</style></head>
<body><div id="v"></div><div id="o">…</div><script>
// Faithful replica of Cesium3DView.tsx (lovable_dev 5653bb2b) layer stack, for measurement only.
const SB_URL=new URLSearchParams(location.search).get('sb')||'https://fckdwddgtdbvhzloejni.supabase.co', SB_KEY=new URLSearchParams(location.search).get('key')||'';
const P=new URLSearchParams(location.search), L=new Set((P.get('layers')||'').split(',').filter(Boolean));
const out=document.getElementById('o'); const say=t=>out.textContent=t;
async function rpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});return r.json();}
(async()=>{
 Cesium.Ion.defaultAccessToken='';
 const viewer=new Cesium.Viewer('v',{baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,
  baseLayer:new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({url:'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage-product/default/current/3857/{z}/{x}/{y}.jpeg',maximumLevel:20,rectangle:Cesium.Rectangle.fromDegrees(5.9,45.8,10.5,47.9)}))});
 const s=viewer.scene; s.globe.depthTestAgainstTerrain=true; s.skyAtmosphere.show=true; try{s.msaaSamples=1}catch{}
 viewer.terrainProvider=await Cesium.CesiumTerrainProvider.fromUrl('https://3d.geo.admin.ch/ch.swisstopo.terrain.3d/v1/',{requestVertexNormals:true});
 const tilesets=[];
 if(L.has('buildings')){const b=await Cesium.Cesium3DTileset.fromUrl('https://3d.geo.admin.ch/ch.swisstopo.swissbuildings3d.3d/v1/tileset.json',{maximumScreenSpaceError:12});b.style=new Cesium.Cesium3DTileStyle({color:'color("white")'});s.primitives.add(b);tilesets.push(['swissBUILDINGS3D',b]);}
 if(L.has('city2')){const c=await Cesium.Cesium3DTileset.fromUrl('commune21_v2/tileset.json',{maximumScreenSpaceError:8});s.primitives.add(c);tilesets.push(['city2',c]);}
 if(L.has('city')){const c=await Cesium.Cesium3DTileset.fromUrl('commune21/tileset.json',{maximumScreenSpaceError:8});s.primitives.add(c);tilesets.push(['city',c]);}
 if(L.has('pc')){const idx=await (await fetch('https://pub-f3932e9291c1458cb0a2bf5b53a77f85.r2.dev/pointcloud/v3/ge/index.json')).json();
   const ctr=[6.148,46.201]; const blocks=(idx.blocks||idx).map(b=>({...b,d:Math.hypot(((b.bbox_wgs84[0]+b.bbox_wgs84[2])/2-ctr[0]),((b.bbox_wgs84[1]+b.bbox_wgs84[3])/2-ctr[1]))})).sort((a,b)=>a.d-b.d).slice(0,8);
   for(const b of blocks){const t=await Cesium.Cesium3DTileset.fromUrl('https://pub-f3932e9291c1458cb0a2bf5b53a77f85.r2.dev/'+b.url,{maximumScreenSpaceError:16});
     Object.assign(t.pointCloudShading,{attenuation:true,maximumAttenuation:4,geometricErrorScale:1,eyeDomeLighting:true,eyeDomeLightingStrength:1,eyeDomeLightingRadius:1});
     t.style=new Cesium.Cesium3DTileStyle({color:{conditions:[['${HeightAboveGround} < 5','color("#2f9fb5")'],['${HeightAboveGround} < 13','color("#5cc45f")'],['${HeightAboveGround} < 26','color("#f0d43a")'],['true','color("#ef8a24")']]}});
     s.primitives.add(t);tilesets.push(['pc',t]);}}
 let bb=null; const cnv=document.createElement('canvas');cnv.width=cnv.height=64;const g=cnv.getContext('2d');g.fillStyle='#3d7a3a';g.beginPath();g.arc(32,28,24,0,7);g.fill();g.fillStyle='#5a3d2a';g.fillRect(29,44,6,20);
 if(L.has('trees')) bb=s.primitives.add(new Cesium.BillboardCollection({scene:s}));
 let parcelsPrim=null, rpcMs=[], rpcCount=0;
 async function onMoveEnd(){
  const r=viewer.camera.computeViewRectangle(); if(!r) return;
  const W=Cesium.Math.toDegrees(r.west),S=Cesium.Math.toDegrees(r.south),E=Cesium.Math.toDegrees(r.east),N=Cesium.Math.toDegrees(r.north);
  const cx=(W+E)/2, cy=(S+N)/2;
  if(bb){const t0=performance.now();const [near,far]=await Promise.all([rpc('get_trees_in_bbox',{p_min_lon:cx-0.006,p_min_lat:cy-0.004,p_max_lon:cx+0.006,p_max_lat:cy+0.004,p_limit:2000,p_min_height:3}),rpc('get_trees_in_bbox',{p_min_lon:W,p_min_lat:S,p_max_lon:E,p_max_lat:N,p_limit:1500,p_min_height:15})]);
   rpcMs.push(performance.now()-t0);rpcCount+=2; bb.removeAll(); const h0=402;
   for(const t of [...(near||[]),...(far||[])]){const lon=t.lon??t.longitude, lat=t.lat??t.latitude, h=t.height_m??t.height??10; if(lon==null)continue;
     bb.add({position:Cesium.Cartesian3.fromDegrees(lon,lat,h0+h/2),image:cnv,width:h*0.8,height:h,sizeInMeters:true,heightReference:Cesium.HeightReference.NONE});}}
  if(L.has('parcels')){const half=0.0035; const ring=[[cx-half,cy-half],[cx+half,cy-half],[cx+half,cy+half],[cx-half,cy+half],[cx-half,cy-half]];
   const t0=performance.now(); const env=await rpc('get_plots_in_polygon',{p_polygon:{type:'Polygon',coordinates:[ring]},p_max:1000,p_predicate:'intersects'}); rpcMs.push(performance.now()-t0); rpcCount++;
   if(parcelsPrim){s.primitives.remove(parcelsPrim);parcelsPrim=null}
   const feats=env?.data?.features||[]; const inst=[];
   for(const f of feats){const polys=f.geometry.type==='MultiPolygon'?f.geometry.coordinates:[f.geometry.coordinates];
     for(const p of polys){const pts=p[0].flat();inst.push(new Cesium.GeometryInstance({geometry:new Cesium.GroundPolylineGeometry({positions:Cesium.Cartesian3.fromDegreesArray(pts),width:2}),attributes:{color:Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.WHITE.withAlpha(0.7))}}));}}
   if(inst.length){parcelsPrim=s.primitives.add(new Cesium.GroundPolylinePrimitive({geometryInstances:inst,appearance:new Cesium.PolylineColorAppearance({translucent:true}),classificationType:Cesium.ClassificationType.TERRAIN,asynchronous:true}));}}
 }
 viewer.camera.moveEnd.addEventListener(onMoveEnd);
 // scripted flight: 4 legs over Geneve-Cite, identical for every scenario
 const legs=[[6.1440,46.1950,700,35,-30],[6.1500,46.1990,420,80,-20],[6.1470,46.2035,520,170,-25],[6.1420,46.2000,380,260,-18]];
 const frames=[]; let last=performance.now(); s.postRender.addEventListener(()=>{const n=performance.now();frames.push(n-last);last=n;});
 const tStart=performance.now();
 for(const [lon,lat,h,hd,p] of legs){await new Promise(res=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,h),orientation:{heading:Cesium.Math.toRadians(hd),pitch:Cesium.Math.toRadians(p)},duration:5,complete:res}));await new Promise(r=>setTimeout(r,2500));}
 // wait for tiles to settle (max 30 s)
 const tLoad0=performance.now(); while(performance.now()-tLoad0<30000 && tilesets.some(([,t])=>!t.tilesLoaded)) await new Promise(r=>setTimeout(r,250));
 const f=frames.slice(5).sort((a,b)=>a-b), q=x=>f[Math.min(f.length-1,Math.floor(f.length*x))];
 const res=Object.assign({layers:[...L].join('+')||'terrain_only', frames:f.length, fps_avg:+(1000*f.length/f.reduce((a,b)=>a+b,0)).toFixed(1), frame_p50_ms:+q(.5).toFixed(1), frame_p95_ms:+q(.95).toFixed(1), frame_max_ms:+f[f.length-1].toFixed(0),
   long_frames_over_50ms:f.filter(x=>x>50).length, total_s:+((performance.now()-tStart)/1000).toFixed(1), settle_s:+((performance.now()-tLoad0)/1000).toFixed(1),
   gpu_mb:+(tilesets.reduce((a,[,t])=>a+(t.totalMemoryUsageInBytes||0),0)/1e6).toFixed(0), rpc_calls:rpcCount, rpc_ms_avg:rpcMs.length?+(rpcMs.reduce((a,b)=>a+b,0)/rpcMs.length).toFixed(0):0,
   net_mb:+(performance.getEntriesByType('resource').reduce((a,e)=>a+(e.transferSize||e.encodedBodySize||0),0)/1e6).toFixed(1), resources:performance.getEntriesByType('resource').length,
   billboards:bb?bb.length:0, parcel_lines:parcelsPrim?parcelsPrim.geometryInstances?.length??'n/a':0});
 window.__prof=res; say(JSON.stringify(res,null,1));
})();
</script></body></html>
