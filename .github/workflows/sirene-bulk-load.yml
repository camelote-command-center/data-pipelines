name: SIRENE Bulk Load

# SCHEDULE DISABLED 2026-08-06. This is a ONE-TIME stock loader, not a recurring job.
# It was left on a monthly cron and hit the 4 h cap on every run (2026-06-05, 07-05,
# 08-05 all cancelled at 4h00m), burning four runner-hours a month and never completing.
# Ongoing refresh belongs to sirene-incremental.yml. Re-run this one by hand
# (workflow_dispatch) only for a deliberate full reload.
#
# How this fires now:
#   - Manual workflow_dispatch only — for re-runs, smoke tests, or partial reloads.
#
# Runtime: ~2 h on a GHA Ubuntu runner against Supabase Frankfurt (matches
# the 31.97.122.135 VPS one-off run on 2026-05-09 — 1h 58m for 6.76 M
# etablissements). 4 h hard cap below.
#
# Idempotent: UPSERT on siren / siret. Re-running the same release is a no-op
# for unchanged rows; only changed rows get UPDATEd.

on:
  # schedule:                 # DISABLED 2026-08-06 — one-time loader, see header
  #   - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Which stages to run"
        required: true
        default: "all"
        type: choice
        options: [all, unite-legale-only, etablissement-only]
      limit_rows:
        description: "Stop after N matched rows per stage (0 = no limit, for smoke tests)"
        required: false
        default: "0"

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4h hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run bulk loader
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          # Direct Postgres DSN — used by _siren_set_from_db for fast (~10s)
          # whitelist load of the 4.8M-SIREN companies table. Without it the
          # parser falls back to PostgREST pagination, which 500'd at offset
          # 1.2M during the first VPS run on 2026-05-09. Reusing the existing
          # repo-wide secret RE_LLM_DB_URL.
          RE_LLM_DATABASE_URL: ${{ secrets.RE_LLM_DB_URL }}
          RE_LLM_SCHEMA: bronze_fr
          SIRENE_CACHE_DIR: ${{ runner.temp }}/sirene_cache
        run: |
          # Schedule fires set inputs to empty; default to "all"
          MODE="${{ github.event.inputs.mode }}"
          LIMIT="${{ github.event.inputs.limit_rows }}"
          ARGS=""
          case "${MODE:-all}" in
            unite-legale-only)  ARGS="--unite-legale-only" ;;
            etablissement-only) ARGS="--etablissement-only" ;;
          esac
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit-rows $LIMIT"
          fi
          python pipelines/sirene/import.py --mode bulk $ARGS

      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-bulk-load.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-bulk-load.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
