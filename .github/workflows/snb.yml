name: SNB / BWO Import

on:
  schedule:
    # Quarterly: 1st of Jan/Apr/Jul/Oct at 9:00 UTC
    # Aligns with SNB cube publishing cadence (mid-month) + BWO ref-rate updates.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python pipelines/snb/import.py
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_SCHEMA: bronze_ch
