name: VD enrichment (canton VD + Lausanne + federal)

# 18 canton-VD / Lausanne / federal layers into re-LLM bronze_ch.
# Parsers live in pipelines/vd_enrichment/<code>/run.py and were originally written for
# VPS deployment (deploy.sh + /etc/cron.d). That deployment was prepared but never enabled,
# so from 2026-06-02 every dataset sat `paused` with "no workflow scheduled yet" — data
# loaded once, never refreshed. This workflow is that missing scheduler.
#
# Cadence: QUARTERLY (operator decision 2026-09-06 — "they should run every 3 months").
# Each parser stamps its OWN dataset via datasets?code=eq.<code>; never the blanket
# workflow_file form, which would mark all 18 fresh on the strength of one run.

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'   # quarterly: 1st of Jan/Apr/Jul/Oct, 04:00 UTC
  workflow_dispatch:
    inputs:
      parser:
        description: 'Run a single parser (blank = all)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false        # one canton layer failing must not cancel the other 17
      max-parallel: 4         # be polite to map.lausanne.ch / canton VD ArcGIS
      matrix:
        parser:
          - federal_bav_transit
          - vd_batiment_projete
          - vd_batiment_rcb
          - vd_classement
          - vd_ddp_pts
          - vd_degre_sensibilite_bruit
          - vd_isos
          - vd_jardin_historique
          - vd_lausanne_archeologie
          - vd_lausanne_ddp
          - vd_lausanne_dp
          - vd_lausanne_energie_cad_bati
          - vd_lausanne_pa_etude
          - vd_lausanne_parking_sectors
          - vd_lausanne_servitudes
          - vd_limite_foret
          - vd_region_archeologique
          - vd_zone_affectation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Run ${{ matrix.parser }}
        if: github.event.inputs.parser == '' || github.event.inputs.parser == matrix.parser
        env:
          SUPABASE_DB_URI: ${{ secrets.RE_LLM_DB_URL }}
          PARSER_HOST: github-actions
        run: PYTHONPATH=. python -m pipelines.vd_enrichment.${{ matrix.parser }}.run

      - name: PATCH last_acquired_at on success
        if: success() && (github.event.inputs.parser == '' || github.event.inputs.parser == matrix.parser)
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.${{ matrix.parser }}" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure or timeout
        if: ${{ failure() || cancelled() }}
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.${{ matrix.parser }}" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
