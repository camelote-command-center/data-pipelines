name: news-rss

# Daily Swiss news aggregator. Walks each feed in pipelines/news-rss/feeds.ts,
# fetches new article URLs, extracts the body, lands one row per article in
# knowledge_ch.documents (categorization handled by the AFTER INSERT trigger).

on:
  schedule:
    - cron: '0 4 * * *'    # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      only_feed:
        description: 'Single feed slug (leave blank to walk all)'
        required: false
        type: string
      max_items:
        description: 'Cap per-feed items this run'
        required: false
        default: '50'
        type: string
      dry_run:
        description: 'Preview only (no DB writes)'
        required: false
        default: 'false'
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/news-rss && npm ci
      - name: Fetch news
        run: cd pipelines/news-rss && npx tsx fetch-news.ts
        env:
          ONLY_FEED: ${{ inputs.only_feed }}
          MAX_ITEMS_PER_FEED: ${{ inputs.max_items || '50' }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - name: Update dataset metadata (success)
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.news_rss.yml&status=neq.deprecated" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
      - name: Report failure to camelote_data
        if: failure()
        run: |
          MSG="Workflow run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.news_rss.yml&status=neq.deprecated" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
