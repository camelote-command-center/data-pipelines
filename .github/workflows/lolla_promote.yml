name: Lolla Daily Promotion

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC (2h after scraper)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of ads to promote (default 25)'
        required: false
        default: '25'
        type: string
      fix_existing:
        description: 'Re-sync already promoted listings (fix missing data)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/lolla-daily && npm ci
      - name: Promote lolla ads to listings
        run: cd pipelines/lolla-daily && npx tsx promote.ts
        env:
          SUPABASE_URL: ${{ secrets.XOXO_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.XOXO_SUPABASE_SERVICE_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
          FIX_EXISTING: ${{ github.event.inputs.fix_existing || '0' }}

      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.lolla_promote.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.lolla_promote.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
