name: SIRENE Incremental Sync

# AUTH IS FIXED (2026-08-06, bug cbb09d8c): an INSEE API key read from the re-LLM
# vault (insee_sirene_api_key) and sent as X-INSEE-Api-Key-Integration. There is no
# OAuth2 token exchange any more - do not reintroduce one. NAF filtering is now
# server-side, which brings a one-day window from ~16k to ~2.6k records, inside the
# API's 10k offset ceiling.
#
# CRON STILL DISABLED - two blockers remain, both verified 2026-08-06:
#   1. BACKLOG. bronze_ch._registry.last_sync_at is 2026-05-09 (the bulk load), so the
#      first incremental window is ~90 days = 230'131 matches, 23x the 10k ceiling. The
#      truncation guard correctly refuses it. Catching up needs the date window walked
#      forward in chunks, which is parser work, not config.
#   2. THROUGHPUT. The establishment phase issues one /siret call per SIREN at the 2.1s
#      rate cap, so a normal ~2'600-company day costs ~92 min against this 30-minute
#      timeout. Verified fix: batch the query as siren:(A OR B OR ...) - tested live and
#      it returns combined results - which collapses ~2'600 calls into ~50.
#
# Enabling the cron before those land would just fail every night. Run by hand with
# workflow_dispatch to test.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 5 * * *'   # DAILY 05:00 UTC once the two blockers above are cleared.
  #                         # Daily is the right cadence: ~2.6k NAF-filtered records a
  #                         # day sits well inside the 10k ceiling, where a month would
  #                         # be ~30x over and would abort rather than truncate.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run incremental sync
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_SCHEMA: bronze_fr
          # API key is read from the re-LLM vault at runtime, not passed as a secret.
          RE_LLM_DATABASE_URL: ${{ secrets.RE_LLM_DB_URL }}
        run: python pipelines/sirene/import.py --mode incremental

      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-incremental.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-incremental.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
