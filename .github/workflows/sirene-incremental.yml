name: SIRENE Incremental Sync

# ENABLED 2026-08-06 (bug cbb09d8c).
#
# Auth: INSEE API key read from the re-LLM vault (insee_sirene_api_key), sent as
# X-INSEE-Api-Key-Integration. No OAuth2 token exchange - do not reintroduce one.
#
# The job walks the window forward in closed date chunks and advances the watermark
# after EACH successful chunk, so an interrupted run resumes instead of restarting,
# and a failed run never advances it (which would silently skip data).
#
# Measured 2026-08-06: one day-chunk = ~86s (813 matched, 798 companies, 1164
# establishments). SIRENE_MAX_CHUNKS=15 therefore caps a run at ~21 min, inside the
# 30-minute timeout, while letting a backlog catch up ~15 days per run. Once caught
# up, a normal day is a single ~90s chunk.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # DAILY 05:00 UTC. Daily is the right cadence: ~2.6k
                          # NAF-filtered records a day sits well inside the 10k
                          # ceiling, where a month would be ~30x over and would
                          # abort rather than truncate.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run incremental sync
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_SCHEMA: bronze_fr
          # API key is read from the re-LLM vault at runtime, not passed as a secret.
          RE_LLM_DATABASE_URL: ${{ secrets.RE_LLM_DB_URL }}
          SIRENE_CHUNK_DAYS: "1"
          SIRENE_MAX_CHUNKS: "15"   # ~21 min worst case, inside the 30 min timeout
        run: python pipelines/sirene/import.py --mode incremental

      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-incremental.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.sirene-incremental.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
