name: FAO LDTR

on:
  schedule:
    - cron: '30 4 * * 6'  # Weekly Saturday at 04:30 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/fao-ldtr && npm ci
      - name: Install Playwright browsers
        run: cd pipelines/fao-ldtr && npx playwright install chromium --with-deps
      - name: Fetch FAO LDTR records
        run: cd pipelines/fao-ldtr && npx tsx fetch-ldtr.ts
        env:
          # Phase 3c (2026-04-29): repointed from lamap_db to re-llm. Parser
          # logical-table 'FAO_LDTR' resolves to physical 'fao_ldtr' on
          # re-llm.bronze_ch via SUPABASE_TABLE_FAO_LDTR.
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCHEMA: bronze_ch
          SUPABASE_TABLE_FAO_LDTR: fao_ldtr
          TWO_CAPTCHA_API_KEY: ${{ secrets.TWO_CAPTCHA_API_KEY }}
      # Split into success/failure PATCH to avoid bug 07bf060b
      # (if: always() makes failed runs look successful on the dashboard).
      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          COUNT=$(curl -s -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Accept-Profile: bronze_ch" -H "Prefer: count=estimated" \
            --head "$URL/rest/v1/fao_ldtr?select=*" \
            | grep -i content-range | sed 's|.*/||' | tr -d '\r')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.ge_fao_ldtr" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"record_count\":${COUNT:-0},\"last_error\":null}"
        env:
          URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.ge_fao_ldtr" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
