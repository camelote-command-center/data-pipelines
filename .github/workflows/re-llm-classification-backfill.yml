name: re-LLM classification backfill

on:
  schedule:
    - cron: '30 4 * * *'   # daily 04:30 UTC, after re-LLM sync jobs (03:15 / 04:00)
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill (writes) | validate (no-write DeepSeek-vs-Sonnet A/B)'
        default: 'backfill'
        type: choice
        options: [backfill, validate]
      provider:
        description: 'backfill provider: deepseek (default/cron) | anthropic (Sonnet A/B)'
        default: 'deepseek'
        type: choice
        options: [deepseek, anthropic]
      sample_size:
        description: 'rows to sample in validate mode'
        default: '80'
      truth:
        description: 'validate ground truth: live (calls Sonnet) | stored (DB labels)'
        default: 'live'
        type: choice
        options: [live, stored]

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: re-llm-classification
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: re-llm-classification
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_RE_LLM_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_RE_LLM_SERVICE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs send no inputs → mode=backfill, provider=deepseek
          # (2026-06-22 cutover): the daily cron now classifies on DeepSeek,
          # ~95% cheaper than Sonnet. Dispatch with provider=anthropic for a
          # Sonnet A/B comparison.
          CLASSIFY_MODE: ${{ github.event.inputs.mode || 'backfill' }}
          CLASSIFY_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
          VALIDATE_SAMPLE: ${{ github.event.inputs.sample_size || '80' }}
          VALIDATE_TRUTH: ${{ github.event.inputs.truth || 'live' }}
        run: python classify_existing.py
