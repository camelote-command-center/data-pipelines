name: DLD Transactions & Rentals

on:
  # schedule:
  #   - cron: '0 5 * * 6' # Saturday 05:00 UTC — DISABLED: DUBAI_PULSE_API_KEY/SECRET not configured
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd pipelines/dld-dubai && npm ci

      - name: Ingest Transactions (last 7 days)
        run: cd pipelines/dld-dubai && npx tsx index.ts --source transactions --from $(date -d '7 days ago' +%Y-%m-%d) --to $(date +%Y-%m-%d)
        env:
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          DUBAI_PULSE_API_KEY: ${{ secrets.DUBAI_PULSE_API_KEY }}
          DUBAI_PULSE_API_SECRET: ${{ secrets.DUBAI_PULSE_API_SECRET }}

      - name: Ingest Rentals (last 7 days)
        run: cd pipelines/dld-dubai && npx tsx index.ts --source rentals --from $(date -d '7 days ago' +%Y-%m-%d) --to $(date +%Y-%m-%d)
        env:
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          DUBAI_PULSE_API_KEY: ${{ secrets.DUBAI_PULSE_API_KEY }}
          DUBAI_PULSE_API_SECRET: ${{ secrets.DUBAI_PULSE_API_SECRET }}

      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.dld-transactions.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.dld-transactions.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
