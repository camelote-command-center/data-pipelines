name: Federal Cadastral Parcels — T2 (Major markets, quarterly)

# Walks BE/ZH/BS/BL/TI via GeoAdmin identify API, lands rows in
# bronze_ch.federal_cadastral_parcels (re-LLM). Composite key
# (canton_code, ident_dn, parcel_number). commune_bfs auto-derived
# post-canton via spatial join against bronze_ch.swiss_communes_geo.
#
# Quarterly cadence: 1st of Jan/Apr/Jul/Oct at 04:00 UTC.

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      cantons:
        description: 'Comma-sep canton override (default: BE,ZH,BS,BL,TI)'
        required: false
      resume:
        description: 'Resume from tile_progress (skip already-walked tiles)'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      dry_run:
        description: 'Walk tiles, do not upsert'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run T2 parser
        run: |
          ARGS=""
          [ -n "${{ inputs.cantons }}" ] && ARGS="$ARGS --cantons ${{ inputs.cantons }}"
          [ "${{ inputs.resume }}" = "true" ] && ARGS="$ARGS --resume"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python pipelines/federal_cadastral_parcels_t2/import.py $ARGS
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_DB_PASSWORD: ${{ secrets.RE_LLM_DB_PASSWORD }}
          CAMELOTE_SUPABASE_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CAMELOTE_SUPABASE_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
      - name: Report failure to camelote_data
        if: failure()
        run: |
          MSG="Workflow run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.federal_cadastral_parcels_t2" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
