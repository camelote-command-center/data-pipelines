name: Federal Cadastral Parcels — T2 (Major markets, quarterly)

# Walks BE/ZH/BS/BL/TI via GeoAdmin identify API, lands rows in
# bronze_ch.federal_cadastral_parcels (re-LLM). Composite key
# (canton_code, ident_dn, parcel_number). commune_bfs auto-derived
# post-canton via spatial join against bronze_ch.swiss_communes_geo.
#
# Quarterly cadence: 1st of Jan/Apr/Jul/Oct at 04:00 UTC.
#
# ARCHITECTURE: matrix-parallel, one job per canton.
# BE alone takes >5h walking tiles, so a sequential canton loop blows
# through the 6h GH Actions ceiling and was being cancelled every run
# (#173 was overdue from 2026-02-24 → 2026-05-28). Each canton now gets
# its own runner + 5h50 budget, and an aggregator job updates the
# camelote-data freshness once after all cantons have reported.

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from tile_progress (skip already-walked tiles)'
        required: false
        default: 'true'
        type: choice
        options: ['false','true']
      dry_run:
        description: 'Walk tiles, do not upsert'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

jobs:
  fetch:
    name: fetch (${{ matrix.canton }})
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GH Actions hard cap is 360
    strategy:
      fail-fast: false      # one canton failing must not cancel the others
      matrix:
        canton: [BE, ZH, BS, BL, TI]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run T2 parser — canton ${{ matrix.canton }}
        run: |
          ARGS="--cantons ${{ matrix.canton }} --skip-freshness-update"
          [ "${{ inputs.resume }}" = "false" ] || ARGS="$ARGS --resume"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python pipelines/federal_cadastral_parcels_t2/import.py $ARGS
        env:
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_DB_PASSWORD: ${{ secrets.RE_LLM_DB_PASSWORD }}
          CAMELOTE_SUPABASE_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CAMELOTE_SUPABASE_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

  aggregate:
    # Runs after all per-canton jobs finish (success or failure). Computes
    # the tier-wide row count from re-LLM and PATCHes camelote-data datasets
    # with last_acquired_at + record_count + last_error.
    name: aggregate freshness
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PATCH camelote-data freshness
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
          RE_URL:  ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_KEY:  ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          FETCH_RESULT: ${{ needs.fetch.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          CANTONS="BE,ZH,BS,BL,TI"
          # Total row count across this tier's cantons in re-LLM bronze_ch.federal_cadastral_parcels.
          CR=$(curl -sI -X GET \
            "$RE_URL/rest/v1/federal_cadastral_parcels?canton_code=in.(${CANTONS})&select=canton_code" \
            -H "apikey: $RE_KEY" -H "Authorization: Bearer $RE_KEY" \
            -H "Accept-Profile: bronze_ch" \
            -H "Prefer: count=exact" -H "Range: 0-0" | tr -d '\r' \
            | awk -F'/' '/^content-range:/ {print $2}')
          COUNT=${CR:-0}
          echo "tier row count: $COUNT (fetch result: $FETCH_RESULT)"

          if [ "$FETCH_RESULT" = "success" ]; then
            PAYLOAD=$(printf '{"last_acquired_at":"%s","record_count":%s,"last_error":null}' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$COUNT")
          else
            ERR="One or more canton matrix jobs failed (result=$FETCH_RESULT). See $RUN_URL"
            ESC=$(printf '%s' "$ERR" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            PAYLOAD=$(printf '{"record_count":%s,"last_error":%s}' "$COUNT" "$ESC")
          fi
          echo "PATCH payload: $PAYLOAD"
          curl -sS -X PATCH "$CMD_URL/rest/v1/datasets?code=eq.federal_cadastral_parcels_t2" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$PAYLOAD"

          # Bubble matrix failure up to the workflow status.
          if [ "$FETCH_RESULT" != "success" ]; then exit 1; fi
