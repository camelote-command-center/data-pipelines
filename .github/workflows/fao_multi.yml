name: FAO Multi — Frequent (weekly)

# High-volume rubriques (≥1 publication/day on average): scrape weekly with a
# 14-day lookback so we always overlap the previous run.
#
# Bucket source: 14-day sample taken 2026-04-27 — 91/72/97 each averaged
# 10+ rows/day. Sparse rubriques live in fao_multi_quarterly.yml.
# Refine after fao_multi_backfill.yml completes if real frequencies differ.

on:
  schedule:
    # Weekly Saturday at 05:00 UTC (after FAO Transactions @04:00 + LDTR @04:30)
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      rubrique:
        description: 'Single rubrique to fetch (leave blank to run the full matrix)'
        required: false
        type: string
      days_back:
        description: 'Lookback window in days (default 14)'
        required: false
        default: '14'
        type: string

jobs:
  # When dispatched with a single rubrique we run a 1-element matrix; otherwise full list.
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      rubriques: ${{ steps.set.outputs.rubriques }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.rubrique }}" ]; then
            echo "rubriques=[${{ inputs.rubrique }}]" >> "$GITHUB_OUTPUT"
          else
            echo 'rubriques=[72, 91, 97]' >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rubrique: ${{ fromJson(needs.resolve-matrix.outputs.rubriques) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/fao-multi && npm ci
      - name: Install Playwright browsers
        run: cd pipelines/fao-multi && npx playwright install chromium --with-deps
      - name: Fetch FAO rubrique ${{ matrix.rubrique }}
        run: cd pipelines/fao-multi && npx tsx fetch-fao.ts
        env:
          RUBRIQUE: ${{ matrix.rubrique }}
          DAYS_BACK: ${{ inputs.days_back || '14' }}
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          # Satisfies the import-time env check in pipelines/_shared/supabase.ts
          # (transitively imported by captcha.ts for `sleep`). The client is never used.
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          TWO_CAPTCHA_API_KEY: ${{ secrets.TWO_CAPTCHA_API_KEY }}

  # ────────────────────────────────────────────────────────────────────────────
  # Dashboard metadata. Separate jobs (one per outcome) so the matrix's
  # per-cell `success/failure` propagates correctly to the PATCH.
  # PATCH filter: `workflow_file=eq.fao_multi.yml` — updates ALL 3 dataset rows
  # tied to this workflow (ge_fao_r72, ge_fao_r91, ge_fao_r97) in one call.
  # See bug 66298402 (workflows missing PATCH leave datasets stuck yellow).
  # ────────────────────────────────────────────────────────────────────────────
  patch-success:
    needs: fetch
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: PATCH last_acquired_at on success
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.fao_multi.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

  patch-failure:
    needs: fetch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: PATCH last_error on failure
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.fao_multi.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
