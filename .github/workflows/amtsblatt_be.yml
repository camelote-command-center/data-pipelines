name: amtsblatt-be-succession

# Bern succession / ownerless-plot event stream.
# Weekly, after the Wednesday Bern Amtsblatt release (and after amtsblatt.yml's
# daily ingest has landed the new metadata). Backfill via workflow_dispatch.

on:
  schedule:
    - cron: '0 6 * * 4'    # Thursday 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'YYYY-MM-DD — only notices on/after this date (blank = full archive backfill)'
        required: false
        type: string
      max:
        description: 'Cap notices fetched this run (blank = no cap)'
        required: false
        type: string
      canton:
        description: 'Canton code (default BE)'
        required: false
        type: string

jobs:
  succession:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/amtsblatt-be && npm ci
      - name: Fetch content + build events
        run: cd pipelines/amtsblatt-be && npx tsx run.ts
        env:
          SINCE: ${{ inputs.since }}
          MAX: ${{ inputs.max }}
          CANTON: ${{ inputs.canton }}
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Update dataset metadata (success)
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.amtsblatt_be.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
      - name: Report failure to camelote_data
        if: failure()
        run: |
          MSG="Workflow run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.amtsblatt_be.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
