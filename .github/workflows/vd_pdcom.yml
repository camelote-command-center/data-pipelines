name: Vaud PDCom coverage and pilot acquisition (Pixxels)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full census/pilot acquisition, or resume source discovery only
        type: choice
        options: [full, discovery]
        default: full
  schedule:
    - cron: '40 3 16 9 *'
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: vd-pdcom
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r pipelines/vd-pdcom/requirements.txt
      - name: Verify coverage contracts
        run: python -m unittest discover -s pipelines/vd-pdcom/tests -v
      - name: Refresh every commune and acquire pilot maps
        if: github.event.schedule == '40 3 16 9 *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
        run: python pipelines/vd-pdcom/parser.py --persist --monitor
      - name: Acquire reviewed official PDCom source documents
        if: github.event.schedule == '40 3 16 9 *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
        run: python pipelines/vd-pdcom/acquire_sources.py --persist
      - name: Refresh official cadastral object kinds
        if: github.event.schedule == '40 3 16 9 *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
        run: python pipelines/vd-pdcom/cadastral_types.py
      - name: Resume municipal discovery and unresolved second-pass backlog
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
        run: python pipelines/vd-pdcom/discovery.py --limit 60 --workers 8 --pages 40 --backlog --monitor
      - name: Batch extract unreviewed PDF candidates
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
        run: python pipelines/vd-pdcom/candidate_batch.py --limit 100 --workers 4
      - name: Verify private Lamap review delivery
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
        run: python pipelines/vd-pdcom/review_delivery.py
      - name: Inventory validated release gates without advancing completion
        env:
          RE_LLM_DB_URL: ${{ secrets.RE_LLM_DB_URL }}
        run: python pipelines/vd-pdcom/release_preflight.py --output vd-pdcom-output/release-preflight.json
      - name: Report failure to Pixxels without advancing freshness
        if: failure() || cancelled()
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          headers={'apikey':os.environ['CMD_KEY'],'Authorization':'Bearer '+os.environ['CMD_KEY'],'Content-Type':'application/json','Prefer':'return=representation'}
          body=json.dumps({'status':'error','last_error':'VD PDCom workflow failed or cancelled: '+os.environ['GITHUB_RUN_ID']}).encode()
          for code in ('vd_pdcom_coverage','vd_pdcom_review_delivery'):
              req=urllib.request.Request(os.environ['CMD_URL']+'/rest/v1/datasets?code=eq.'+code,data=body,method='PATCH',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  assert len(json.load(r))==1, 'Missing VD dataset registration'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vd-pdcom-${{ github.run_id }}
          path: vd-pdcom-output/
          retention-days: 90
