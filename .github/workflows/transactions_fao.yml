name: FAO Transactions

# New cadence (Brief E.2, 2026-05-24):
#   Friday  20:00 UTC — primary run (always executes)
#   Monday  09:00 UTC — retry 1, GATED on freshness (skip if data within last 3d)
#   Monday  15:00 UTC — retry 2, same gate
# DST drift accepted: schedules are UTC, effective CEST/CET local shifts ±1h twice/yr.

on:
  schedule:
    - cron: '0 20 * * 5'   # Fri 20:00 UTC primary
    - cron: '0 9 * * 1'    # Mon 09:00 UTC retry 1
    - cron: '0 15 * * 1'   # Mon 15:00 UTC retry 2
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - name: Friday primary + workflow_dispatch always run
        id: gate-friday
        if: github.event.schedule == '0 20 * * 5' || github.event_name == 'workflow_dispatch'
        run: echo "should-run=true" >> "$GITHUB_OUTPUT"

      - name: Monday retry — check bronze_ch.fao_transactions freshness on re-LLM
        id: gate-monday
        if: github.event.schedule == '0 9 * * 1' || github.event.schedule == '0 15 * * 1'
        env:
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s "$SUPABASE_URL/rest/v1/rpc/check_fao_freshness" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_table_name":"fao_transactions","p_lookback_days":3}')
          IS_FRESH=$(echo "$RESPONSE" | jq -r '.is_fresh')
          ROW_COUNT=$(echo "$RESPONSE" | jq -r '.row_count')
          echo "Freshness response: $RESPONSE (is_fresh=$IS_FRESH, row_count=$ROW_COUNT)"
          if [ "$IS_FRESH" = "true" ]; then
            echo "Data already fresh — skipping retry."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Data NOT fresh — proceeding with retry."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Consolidate gate outputs
        id: gate
        run: |
          OUT="${{ steps.gate-friday.outputs.should-run }}${{ steps.gate-monday.outputs.should-run }}"
          if [ -z "$OUT" ]; then OUT=false; fi
          echo "should-run=$OUT" >> "$GITHUB_OUTPUT"

  fetch:
    needs: check-freshness
    if: needs.check-freshness.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd pipelines/_shared && npm ci
      - run: cd pipelines/transactions-fao && npm ci
      - name: Regression test — safe_cast DD.MM.YYYY date parsing (bug f3538ed1)
        run: cd pipelines/transactions-fao && npx tsx date-parse.test.ts
        env:
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Install Playwright browsers
        run: cd pipelines/transactions-fao && npx playwright install chromium --with-deps
      - name: Fetch FAO Transactions
        run: cd pipelines/transactions-fao && npx tsx fetch-transactions.ts
        env:
          # Phase 3c (2026-04-29): repointed from lamap_db to re-llm. Parser
          # now writes to re-llm.bronze_ch.fao_transactions via SUPABASE_SCHEMA
          # + SUPABASE_TABLE_TRANSACTIONS overrides in _shared/supabase.ts.
          # Lamap_db legacy bronze.transactions stops growing; lamap_db ref.*
          # continues to read from re-llm via FDW push.
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCHEMA: bronze_ch
          SUPABASE_TABLE_TRANSACTIONS: fao_transactions
          TWO_CAPTCHA_API_KEY: ${{ secrets.TWO_CAPTCHA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Canary — fail if transactions landed mis-dated (date-sanity)
        if: success()
        run: |
          RESPONSE=$(curl -s "$SUPABASE_URL/rest/v1/rpc/check_fao_freshness" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_table_name":"fao_transactions","p_lookback_days":3}')
          SUSP=$(echo "$RESPONSE" | jq -r '.suspicious_dates // 0')
          echo "date-sanity canary: $RESPONSE"
          if [ "$SUSP" != "0" ] && [ "$SUSP" != "null" ]; then
            echo "::error::Date-sanity canary tripped: $SUSP transactions landed dated >30d in the past (possible mis-parse / new upstream format)."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
      # Split into success/failure PATCH to avoid bug 07bf060b
      # (if: always() makes failed runs look successful on the dashboard).
      - name: PATCH last_acquired_at on success
        if: success()
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.transactions_fao.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.transactions_fao.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
