name: OSM Import

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'   # quarterly sweep: 1st of Jan/Apr/Jul/Oct at 3:00 UTC
    - cron: '0 4 * * *'          # continuation: finishes a sweep the 180 min cap cut short (no-op when nothing is due)
  workflow_dispatch:
    inputs:
      time_budget_minutes:
        description: 'Stop starting new cantons after N minutes (job cap is 180)'
        required: false
        default: '150'
      all:
        description: 'Refresh every canton, ignoring recorded progress'
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - id: run
        run: |
          set -o pipefail   # without it, tee's exit code would hide a failed import
          ARGS="--time-budget-minutes ${INPUT_BUDGET:-150}"
          if [ "$INPUT_ALL" = "true" ]; then ARGS="$ARGS --all"; fi
          python pipelines/osm/import.py $ARGS | tee osm-run.log
          grep -q 'OSM_CYCLE_COMPLETE=true' osm-run.log && echo "complete=true" >> "$GITHUB_OUTPUT" || echo "complete=false" >> "$GITHUB_OUTPUT"
        env:
          INPUT_BUDGET: ${{ github.event.inputs.time_budget_minutes }}
          INPUT_ALL: ${{ github.event.inputs.all }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RE_LLM_SUPABASE_URL: ${{ secrets.RE_LLM_SUPABASE_URL }}
          RE_LLM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RE_LLM_SUPABASE_SERVICE_ROLE_KEY }}
          RE_LLM_SCHEMA: bronze_ch
          CAMELOTE_SUPABASE_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CAMELOTE_SUPABASE_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      # Only a cycle that refreshed every canton stamps freshness; a budget-bounded run keeps the
      # previous last_acquired_at so the dataset cannot look fresher than the data is.
      - name: PATCH last_acquired_at on a complete cycle
        if: success() && steps.run.outputs.complete == 'true'
        run: |
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.osm.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_acquired_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"last_error\":null}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}

      - name: PATCH last_error on failure
        if: failure()
        run: |
          MSG="GitHub Actions run ${{ github.run_id }} failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ESC=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -s -X PATCH "$CMD_URL/rest/v1/datasets?workflow_file=eq.osm.yml" \
            -H "apikey: $CMD_KEY" -H "Authorization: Bearer $CMD_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_error\":${ESC}}"
        env:
          CMD_URL: ${{ secrets.CAMELOTE_DATA_SUPABASE_URL }}
          CMD_KEY: ${{ secrets.CAMELOTE_DATA_SUPABASE_SERVICE_KEY }}
